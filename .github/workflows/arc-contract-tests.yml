name: ARC research contract

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: arc-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  offline-arc-validation:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      REPO_VISIBILITY: public
    steps:
      - name: Checkout isolated PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Validate scaffold and verified repository visibility
        run: python3 -B scripts/validate_repository.py --phase scaffold --repo-visibility "$REPO_VISIBILITY"
      - name: Validate documentation character budgets
        run: python3 -B scripts/validate_documentation.py
      - name: Validate public Pages boundary
        run: python3 -B scripts/validate_pages.py
      - name: Run offline unit tests
        run: python3 -B -m unittest discover -s tests -v
      - name: Confirm public catalog is deterministic
        run: |
          set -euo pipefail
          python3 -B scripts/build_public_catalog.py
          git diff --exit-code -- pages/projects.md
          python3 -B scripts/validate_pages.py
          python3 -B scripts/validate_documentation.py
