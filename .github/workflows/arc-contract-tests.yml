name: ARC research contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: arc-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-arc-validation:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      REPO_VISIBILITY: public
    steps:
      - name: Checkout exact isolated PR HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Assert exact SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "Expected PR HEAD: $EXPECTED_SHA"
          echo "Checked-out SHA: $actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"
      - name: Install pinned research-schema dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input -r requirements-research.txt
      - name: Install minimal LaTeX toolchain for manuscript smoke test
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends latexmk texlive-latex-recommended lmodern
          command -v latexmk
          command -v pdflatex
      - name: Validate scaffold and verified repository visibility
        run: python3 -B scripts/validate_repository.py --phase scaffold --repo-visibility "$REPO_VISIBILITY" --repo-full-name "$GITHUB_REPOSITORY"
      - name: Validate documentation character budgets
        run: python3 -B scripts/validate_documentation.py
      - name: Verify optional programme branding is synchronized
        run: python3 -B scripts/site_branding.py
      - name: Validate public Pages boundary
        run: python3 -B scripts/validate_pages.py
      - name: E1 isolated CLI lifecycle and non-disclosure scenarios
        run: python3 -B -m unittest discover -s tests -p 'test_lifecycle_cli.py' -v
      - name: Run offline unit tests with JSON Schema parity
        run: python3 -B -m unittest discover -s tests -v
      - name: Confirm public catalog is deterministic
        run: |
          set -euo pipefail
          python3 -B scripts/build_public_catalog.py
          python3 -B scripts/build_article_catalog.py
          git diff --exit-code -- pages/projects.md pages/articles.md
          python3 -B scripts/validate_pages.py
          python3 -B scripts/validate_documentation.py
      - name: Build reviewed public HTML with pinned MkDocs
        run: |
          set -euo pipefail
          python3 -m venv /tmp/arc-mkdocs
          /tmp/arc-mkdocs/bin/pip install --disable-pip-version-check --no-input 'mkdocs==1.6.1'
          /tmp/arc-mkdocs/bin/mkdocs build --strict
      - name: Audit generated HTML
        run: python3 -B scripts/validate_site.py --strict
